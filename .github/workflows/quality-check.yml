name: Code Quality Check
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
permissions:
  contents: read
  checks: write
env:
  APP_DIR: apps/randi-chat
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/randi-chat/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}
      - name: Run ESLint
        run: npm run lint
        working-directory: ${{ env.APP_DIR }}
      - name: Check formatting
        run: npm run format:check
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/randi-chat/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}
      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: ${{ env.APP_DIR }}
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/randi-chat/coverage/coverage-final.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/randi-chat/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}
      - name: Run TypeScript check
        run: ./node_modules/.bin/tsc --noEmit --project tsconfig.json
        working-directory: ${{ env.APP_DIR }}
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/randi-chat/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: ${{ env.APP_DIR }}
      - name: Run build
        run: npm run build
        working-directory: ${{ env.APP_DIR }}
        env:
          NEXT_PUBLIC_PRIVY_APP_ID: ${{ secrets.NEXT_PUBLIC_PRIVY_APP_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
